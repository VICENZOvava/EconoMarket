<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>EconoMarket - Comparador</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/style.css">
</head>

<body>

  <div class="grain"></div>

  <section class="comparison-section">

    <div class="comparison-head">

      <div>

        <div class="eyebrow">
          Comparador de preços
        </div>

        <div class="nav-actions">

          <a class="nav-cta" href="perfil.html">
            Perfil
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="8" r="4"></circle>
              <path d="M4 21c0-4 3.5-7 8-7s8 3 8 7"></path>
            </svg>
          </a>

          <a class="nav-cta" href="index.html">
            Logout
            <svg
              width="12"
              height="12"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2.5"
              stroke-linecap="round"
            >
              <line x1="7" y1="17" x2="17" y2="7"></line>
              <polyline points="7 7 17 7 17 17"></polyline>
            </svg>
          </a>

        </div>

        <h2>
          Monte sua lista e descubra
          onde <em>comprar mais barato.</em>
        </h2>

      </div>

      <p>
        Adicione os produtos da sua compra e compare os preços
        entre os mercados parceiros do EconoMarket.
      </p>

    </div>


    <div class="comparison-box">

      <div class="comparison-form">

        <div class="input-group">

          <label for="produto">
            Produto
          </label>

          <input
            type="text"
            id="produto"
            placeholder="Ex: Arroz 5kg"
          >

        </div>


        <div class="input-group quantidade">

          <label for="quantidade">
            Quantidade
          </label>

          <input
            type="number"
            id="quantidade"
            value="1"
            min="1"
          >

        </div>


        <button
          class="comparison-btn"
          id="btnAdicionarProduto"
          type="button"
        >
          Adicionar produto
        </button>

      </div>


      <div class="shopping-list">

        <div class="list-header">
          <span>Produto</span>
          <span>Quantidade</span>
          <span>Ação</span>
        </div>

        <div id="listaProdutos">
        </div>

      </div>

    </div>


    <div class="comparison-result">

      <div class="result-title">

        <span class="result-icon"></span>

        <div>

          <small>
            Melhor opção
          </small>

          <h3 id="mercadoMaisBarato">
            Aguardando produtos
          </h3>

        </div>

      </div>


      <div class="result-values">

        <div class="result-card">

          <span>
            Total da compra
          </span>

          <strong id="totalCompra">
            R$ 0,00
          </strong>

        </div>


        <div class="result-card">

          <span>
            Você economiza
          </span>

          <strong id="economia">
            R$ 0,00
          </strong>

        </div>

      </div>

    </div>

  </section>


  <script src="./js/script.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

</body>

</html>
