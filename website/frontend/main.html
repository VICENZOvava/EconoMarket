<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="./css/style.css">

<div class="grain"></div>


<!-- ============ COMPARADOR ECONOMARKET ============ -->
<section class="comparison-section">

  <div class="comparison-head">
    <div>
      <div class="eyebrow">Comparador de preços</div>


    <a class="nav-cta" href="index.html">
        Logout
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
        <line x1="7" y1="17" x2="17" y2="7" />
        <polyline points="7 7 17 7 17 17" />
        </svg>
    </a>

      <h2>
        Monte sua lista e descubra
        onde <em>comprar mais barato.</em>
      </h2>
    </div>

    <p>
      Adicione os produtos da sua compra e compare os preços
      entre os mercados parceiros do EconoMarket.
    </p>
  </div>

  <!-- ÁREA DE ADICIONAR PRODUTO -->
  <div class="comparison-box">

    <div class="comparison-form">

      <div class="input-group">
        <label for="produto">Produto</label>
        <input
          type="text"
          id="produto"
          placeholder="Ex: Arroz 5kg"
        />
      </div>

      <div class="input-group quantidade">
        <label for="quantidade">Quantidade</label>
        <input
          type="number"
          id="quantidade"
          value="1"
          min="1"
        />
      </div>

      <button class="comparison-btn" id="btnAdicionarProduto">
        Adicionar produto
      </button>

    </div>

    <!-- LISTA DE PRODUTOS -->
    <div class="shopping-list">

      <div class="list-header">
        <span>Produto</span>
        <span>Quantidade</span>
        <span>Ação</span>
      </div>

      <div id="listaProdutos">

        <!-- Os produtos serão adicionados pelo JavaScript -->

      </div>

    </div>

  </div>

  <!-- RESULTADO DA COMPARAÇÃO -->
  <div class="comparison-result">

    <div class="result-title">
      <span class="result-icon"></span>

      <div>
        <small>Melhor opção</small>
        <h3 id="mercadoMaisBarato">
          Aguardando produtos
        </h3>
      </div>
    </div>

    <div class="result-values">

      <div class="result-card">
        <span>Total da compra</span>
        <strong id="totalCompra">
          R$ 0,00
        </strong>
      </div>

      <div class="result-card">
        <span>Você economiza</span>
        <strong id="economia">
          R$ 0,00
        </strong>
      </div>

    </div>t

  </div>

</section>

<script src="./js/script.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
